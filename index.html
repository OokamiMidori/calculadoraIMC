<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMC</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <div class="container">
            <div class="title">Calculadora - IMC</div>
            <div class="input">
                <label>Nome:</label>
                <input type="text" id="nome" placeholder="Fulano">
            </div>
            <div class="input">
                <label>Altura:</label>
                <input type="number" id="altura" placeholder="1,70">
            </div>
            <div class="input">
                <label>Peso:</label>
                <input type="number" id="peso" placeholder="70">
            </div>
            <button id="calcular">Calcular</button>

            <div class="result" id="resultado">Resultado</div>
        </div>
        <div class="footer" id="footer"> Criado por Fábio Couto</div>
    </main>
    <script src="./imc.js"></script>
</body>

</html>
